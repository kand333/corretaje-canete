# Local PostgreSQL for development and tests. Not for production.
# Fixed project and container names plus host port 5443 keep this project isolated from
# other local projects (see "Puertos" in README.md).
name: corretaje-canete
services:
  postgres:
    image: postgres:16-alpine
    container_name: corretaje-canete-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      # Reachable only from this machine.
      - "127.0.0.1:5443:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is created: adds the test database.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
